name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file
      # dist-is-current, themes-are-filled, shell-is-clean
      - run: nix flake check --no-write-lock-file
      # The themes must stay usable without Nix: install.sh copies dist/ into a config tree,
      # and btop only finds a theme under the name it lands with
      - name: install.sh works
        run: |
          ./install.sh --config-home "$PWD/out"
          test -f out/kitty/ddlc-kitty-dark.conf
          test -f out/btop/themes/ddlc-dark.theme
          ./install.sh --destdir "$PWD/stage" --config-home /usr/share/ddlc-terminal-themes --component kitty
          test -f stage/usr/share/ddlc-terminal-themes/kitty/ddlc-kitty-dark.conf
          test ! -e stage/usr/share/ddlc-terminal-themes/btop
          ./install.sh --config-home "$PWD/legacy-kitty" --kitty
          test -f legacy-kitty/kitty/ddlc-kitty-dark.conf
          test ! -e legacy-kitty/btop
          ./install.sh --config-home "$PWD/legacy-btop" --btop
          test ! -e legacy-btop/kitty
          test -f legacy-btop/btop/themes/ddlc-dark.theme
          ! DESTDIR=$PWD/bad ./install.sh --config-home usr/share/themes >/dev/null 2>&1
      - run: nix fmt -- --ci

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-write-lock-file --command shellcheck generate.sh install.sh
      - run: nix develop --no-write-lock-file --command shfmt -d -i 2 -ci generate.sh install.sh
